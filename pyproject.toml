[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "deepdiff"
version = "9.1.0"
dependencies = [
  "cachebox>=6.1.2,<7",
  "orderly-set>=5.5.0,<6",
]
requires-python = ">=3.11"
authors = [
  { name = "Seperman", email = "sep@zepworks.com" }
]
maintainers = [
  { name = "Seperman", email = "sep@zepworks.com" }
]
description = "Deep Difference and Search of any Python object/data. Recreate objects by adding adding deltas to each other."
readme = "README.md"
license = {file = "LICENSE"}
keywords = []
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License"
]

# `dependency-groups` would make this a lot cleaner, in theory.
[project.optional-dependencies]
coverage = [
  "coverage~=7.17.3",
]
cli = [
  "click~=8.5.1",
  "pyyaml~=6.0.3"
]
dev = [
  "bump2version~=1.0.1",
  "jsonpickle~=4.1.4",
  "ipdb~=0.13.13",
  "numpy~=2.5.4; python_version >= '3.12'",
  "numpy~=2.4.6; python_version < '3.12'",
  "python-dateutil~=4.0.0",
  "orjson~=3.13.0",
  "tomli-w~=1.2.0",
  "pandas~=3.1.1",
  "polars~=2.1.0",
  "nox==2026.10.20",
  "uuid6==2025.0.1",
  "pytz",
  "flit-core==4.2.0",
]
docs = [
  "Sphinx~=9.0.4",
  "sphinx-sitemap~=2.9.0",
  "sphinxemoji~=0.3.2",
  "furo>=2025.12.19",
]
static = [
  "flake8~=7.5.0",
  "flake8-pyproject~=1.2.4",
  "pydantic~=2.14.3",
]
test = [
  "pytest~=9.2.0",
  "pytest-benchmark~=5.3.1",
  "pytest-cov~=7.1.0",
  "python-dotenv~=1.2.4",
]
optimize = [
  "orjson",
]

[project.scripts]
deep = "deepdiff.cli:main"

[project.urls]
Homepage = "https://zepworks.com/deepdiff/"
Documentation = "https://zepworks.com/deepdiff/"
Repository = "https://github.com/qlustered/deepdiff"
Issues = "https://github.com/qlustered/deepdiff/issues"

[tool.coverage.run]
branch = true
source = ["."]

[tool.flake8]
max-line-length = 120
builtins = "json"
statistics = true
ignore = "E202"
exclude = "./data,./src,.svn,CVS,.bzr,.hg,.git,__pycache__"

[tool.flit.sdist]
include = [
  "AUTHORS.md",
  "CHANGELOG.md",
  "CITATION.cff",
  "conftest.py",
  "docs/",
  "mypy.ini",
  "noxfile.py",
  "tests/",
]
exclude = [
  "docs/.env",
  "docs/_build/",
  "docs/**/*.png",
  "docs/CLAUDE.md",
  "docs/AGENTS.md",
]

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:Pdb"
